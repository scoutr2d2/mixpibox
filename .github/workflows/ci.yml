name: CI

# Lint (Biome, per workspace), backend unit tests + type-check, and a full
# build of all workspaces. See MODERNIZATION.md (B0 — foundation).
#
# The frontend Karma test (`ng test`) is intentionally NOT run here yet — it
# needs a headless browser. The production `ng build` in the "build" job already
# exercises the whole frontend compile, so regressions are still caught.

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    # NOT BLOCKING, on purpose and dated: on 25.09.2026 Biome reported 145
    # errors, nearly all formatting and import order. The mass reformat
    # belongs in the internal tree, where parallel sessions edit the same
    # files — a reformat pushed from here would collide with all of them.
    # Remove this line in the same commit that makes `npm run lint` green.
    # (Taken over from scoutr2d2/mixpibox#2, which also declares the
    # frontend-admin dependencies; on merge, main's ci.yml wins.)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Backend tests + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check-types --workspace=mupibox-backend-player
      - run: npm run test --workspace=mupibox-backend-api
      - run: npm run test --workspace=mupibox-backend-player

  build:
    name: Build all workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
