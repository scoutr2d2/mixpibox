# DER SCHALTER DER TONMASCHINE (E42) — als Drop-In, damit die librespot-Unit
# selbst unangetastet bleibt (sie kommt aus dem Rezept; eine zweite Fassung
# hier im Repo liefe auseinander). ExecCondition wird ANGEHAENGT, die Unit
# hat selbst keine.
#
# librespot laeuft, solange spotify.engine NICHT "soloist" ist — also auch
# dann, wenn der Schluessel fehlt oder die Konfiguration ihn nie erwaehnt.
# Der Rueckweg ist damit immer frei: Wert loeschen, beide Units neu starten.
# Ziel: /etc/systemd/system/librespot.service.d/engine.conf
[Service]
# JQ DIREKT, OHNE BASH DAZWISCHEN: systemd macht aus \" ein blankes " -
# die Bash-Verschachtelung kippt, jq bekommt librespot UNQUOTIERT und
# bricht ab ("soloist/0 is not defined"). Am Geraet passiert (19.08.2026):
# die Condition fiel, und librespot startete nicht mehr. In systemds
# EIGENEN einfachen Anfuehrungszeichen ueberleben die inneren doppelten.
ExecCondition=/usr/bin/jq -e '(.spotify.engine // "librespot") != "soloist"' /etc/mupibox/mupiboxconfig.json
