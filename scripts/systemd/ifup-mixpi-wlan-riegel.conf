# Drop-in fuer ifup@.service — der WLAN-Adapterwahl-Riegel (MixPi, E131/C1).
#
# Ablageort auf der Box: /etc/systemd/system/ifup@.service.d/mixpi-wlan-riegel.conf
#
# ExecCondition mit Rueckgabe 1 UEBERSPRINGT die Instanz: die abgewaehlte
# Funkkarte wird gar nicht erst hochgefahren, statt nach network-online
# wieder hingelegt zu werden (Begruendung und die Sicherheitsregel: Kopf von
# mixpi-wlan-riegel.sh).
#
# ExecCondition UND NICHT ExecStartPre — am Geraet gelernt (06.09.2026):
# mit ExecStartPre bricht systemd zwar richtig ab, markiert die Unit aber
# als FAILED. `systemctl --failed` zeigte danach dauerhaft ifup@wlan0, und
# eine rote Zeile, die keinen Fehler meint, macht die naechste echte
# unsichtbar (dieselbe Falle wie eine dauerrote Wache). ExecCondition ist
# genau fuer diesen Fall gebaut: Rueckgabe 1-254 heisst „uebersprungen",
# die Unit bleibt sauber inaktiv.
#
# DIE HUELLE UM DEN AUFRUF IST DIE RUECKFALLSICHERUNG: fehlt das Skript
# (halb ausgerollte Box), gibt die sh-Zeile 0 zurueck und ALLE Karten
# duerfen hoch — ein fehlender Riegel darf niemals alle Tueren verschliessen.
[Service]
ExecCondition=/bin/sh -c '[ ! -x /usr/local/bin/mupibox/mixpi-wlan-riegel.sh ] || exec /usr/local/bin/mupibox/mixpi-wlan-riegel.sh %I'
