<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="ARD Mediathek">
  <!-- Ein Schirm mit Abspielzeichen. Neutral gehalten: kein Sender-Logo,
       keine Marke. Das Icon gehoert dem Plugin und reist mit ihm (E77). -->
