    svg { color: #f2f2f7; }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4.5" width="19" height="13" rx="2" />
    <path d="M9 20.5h6" />
    <path d="M10.2 8.6v4.8l4.3-2.4z" fill="currentColor" stroke-width="1.4" />
  </g>
