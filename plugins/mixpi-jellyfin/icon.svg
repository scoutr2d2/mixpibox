    svg { color: #f2f2f7; }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <rect x="3.2" y="4.5" width="17.6" height="12.5" rx="2" />
    <path d="M10 8.5v4.6l4.2-2.3z" fill="currentColor" stroke="none" />
    <path d="M8 20h8" stroke-linecap="round" />
  </g>
</svg>
