# Bluetooth-Audio unabhaengig von der AKTIVEN logind-Sitzung erlauben.
#
# WARUM: WirePlumber gibt Bluetooth-Geraete normalerweise nur der Sitzung auf
# dem aktiven Seat frei. Auf dieser Box qualifiziert sich keine: die
# tty1-Anmeldung sitzt zwar auf seat0, ist aber Active=no, weil X den
# Bildschirm auf tty2 uebernimmt. Folge: WirePlumber registriert KEINEN
# A2DP-Endpunkt bei bluetoothd, und bluetoothctl meldet
# 'br-connection-profile-unavailable' — obwohl alles installiert ist.
# Die WirePlumber-Doku nennt genau diesen Fall (ein Benutzer, der unabhaengig
# von der aktiven Sitzung Bluetooth nutzen darf).
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
