<!--
  Xbox Wireless Controller (Series X|S), schematisch — nach dem Foto des
  Betreibers (06.09.2026) gezeichnet, im Stil der beiden Fernbedienungs-
  Schemata. Die ausfuehrliche Begruendung der `data-taste`-Konvention steht
  in `googletv.svg`.

  ══ WAS DAS FOTO GEGENUEBER DEM ERSTEN ENTWURF KORRIGIERT HAT ═══════════════

  1. DIE FARBEN SITZEN IN DEN BUCHSTABEN, NICHT IN DEN KNOEPFEN. Die vier
     Tasten sind dunkel; Y ist gelb, X blau, B rot, A gruen. Ein Schema mit
     vier lila Knoepfen haette niemand mit seinem Controller in Verbindung
     gebracht.
  2. SHARE SITZT MITTIG UNTER VIEW/MENUE, nicht dazwischen — und traegt das
     Pfeil-aus-Kasten-Zeichen.
  3. DIE STICKS SIND ASYMMETRISCH: links oben, rechts unten neben dem Kreuz.

  ══ KENNUNGS-KONVENTION, UM ZWEI SONDERFAELLE ERWEITERT ═════════════════════

  Numerisch  = Kernelcode einer Taste, gegen `keys` im Profil pruefbar.
  `ring`     = Sammelflaeche Steuerkreuz (Achsen 16/17 — EV_ABS, keine Tasten;
               am Geraet gemessen, siehe xbox-wireless.json).
  `stick`    = Sammelflaeche linker Daumenstick (Achsen 0/1, mit Totzone).
  `x-…`      = existiert, erreicht die Belegung aber nicht: die Xbox-Taste
               meldet sich nicht als gewoehnliche Taste, der rechte Stick ist
               bewusst unbelegt, die Trigger sind analog und brauchen erst
               eine Schwellen-Behandlung (BACKLOG E137).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" height="100%" role="img" aria-labelledby="xbx-titel xbx-text">
  <title id="xbx-titel">Xbox Wireless Controller</title>
  <desc id="xbx-text">Linker Stick oben, Steuerkreuz darunter, rechter Stick unten mittig, vier Tasten als Raute rechts, oben Schultertasten und Trigger, mittig Xbox-, View-, Menue- und Share-Taste.</desc>
  <defs>
    <linearGradient id="xBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2e33" />
      <stop offset="55%" stop-color="#1e2125" />
      <stop offset="100%" stop-color="#141618" />
    </linearGradient>
    <filter id="xShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <radialGradient id="xStickGrad" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#33373d" />
      <stop offset="100%" stop-color="#101214" />
    </radialGradient>
    <linearGradient id="xBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e3237" />
      <stop offset="100%" stop-color="#17191c" />
    </linearGradient>
    <filter id="xBtnShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Trigger (hinten) — analog, noch unbelegt. Nur ein schmaler Streifen
       ragt ueber die Gehaeusekante; beim ersten Wurf standen sie wie Ohren
       ueber dem Controller (am gerenderten Bild gesehen, rsvg-convert). -->
  <g data-taste="x-lt" data-name="LT (Trigger links, analog)">
    <path d="M 128,52 q 20,-12 48,-10 l -2,18 q -26,-2 -44,8 z" fill="#17191c" stroke="#31353a" stroke-width="1.2" />
  </g>
  <g data-taste="x-rt" data-name="RT (Trigger rechts, analog)">
    <path d="M 392,52 q -20,-12 -48,-10 l 2,18 q 26,-2 44,8 z" fill="#17191c" stroke="#31353a" stroke-width="1.2" />
  </g>

  <!-- Schultertasten — flach an der Oberkante, wie am Geraet -->
  <g data-taste="310" data-name="LB (Schulter links)">
    <path d="M 126,64 q 44,-16 96,-12 l -2,16 q -50,-4 -90,10 z" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1.2" />
  </g>
  <g data-taste="311" data-name="RB (Schulter rechts)">
    <path d="M 394,64 q -44,-16 -96,-12 l 2,16 q 50,-4 90,10 z" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1.2" />
  </g>

  <!-- ================= GEHAEUSE ================= -->
  <path d="M 168,64
           C 200,54 320,54 352,64
           C 406,72 448,94 464,134
           C 482,182 476,252 438,300
           C 418,326 386,324 374,298
           C 358,262 338,240 310,232
           L 210,232
           C 182,240 162,262 146,298
           C 134,324 102,326 82,300
           C 44,252 38,182 56,134
           C 72,94 114,72 168,64 Z"
        fill="url(#xBodyGrad)" stroke="#383d43" stroke-width="1.5" filter="url(#xShadow)" />

  <!-- Xbox-Taste — meldet sich nicht als gewoehnliche Taste. KEIN
       Logo-Nachbau (der erste Versuch wurde ein Klecks, und die Kugel mit
       dem X ist ohnehin eine fremde Marke): eine helle Kugel mit schlichtem
       X reicht zur Wiedererkennung. -->
  <g data-taste="x-xbox" data-name="Xbox-Taste" filter="url(#xBtnShadow)">
    <circle cx="260" cy="92" r="21" fill="#0e0f11" stroke="#3a3f45" stroke-width="1.2" />
    <circle cx="260" cy="92" r="14" fill="none" stroke="#d9dde1" stroke-width="2" />
    <line x1="253" y1="85" x2="267" y2="99" stroke="#d9dde1" stroke-width="2.6" stroke-linecap="round" />
    <line x1="267" y1="85" x2="253" y2="99" stroke="#d9dde1" stroke-width="2.6" stroke-linecap="round" />
  </g>

  <!-- Linker Stick — Sammelflaeche, Achsen 0/1 mit Totzone -->
  <g data-taste="stick" data-name="Linker Stick (navigieren)">
    <circle cx="152" cy="138" r="42" fill="#101214" stroke="#383d43" stroke-width="1.5" filter="url(#xBtnShadow)" />
    <circle cx="152" cy="138" r="30" fill="url(#xStickGrad)" stroke="#2c3036" stroke-width="1" />
    <circle cx="152" cy="138" r="21" fill="none" stroke="#0b0c0d" stroke-width="2.5" />
  </g>

  <!-- View / Menue -->
  <g data-taste="314" data-name="View" filter="url(#xBtnShadow)">
    <circle cx="220" cy="140" r="13" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1" />
    <rect x="214.5" y="135" width="8" height="8" rx="1.5" fill="none" stroke="#cfd4d8" stroke-width="1.6" />
    <rect x="218" y="138" width="8" height="8" rx="1.5" fill="#17191c" stroke="#cfd4d8" stroke-width="1.6" />
  </g>
  <g data-taste="315" data-name="Menü" filter="url(#xBtnShadow)">
    <circle cx="300" cy="140" r="13" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1" />
    <line x1="294" y1="135.5" x2="306" y2="135.5" stroke="#cfd4d8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="294" y1="140" x2="306" y2="140" stroke="#cfd4d8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="294" y1="144.5" x2="306" y2="144.5" stroke="#cfd4d8" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Share — Code 167, am Geraet gemessen; oeffnet die Spielecke -->
  <g data-taste="167" data-name="Share (Spielecke)" filter="url(#xBtnShadow)">
    <rect x="246" y="164" width="28" height="22" rx="7" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1" />
    <rect x="254" y="172" width="12" height="9" rx="1.5" fill="none" stroke="#cfd4d8" stroke-width="1.5" />
    <path d="M 260,175 L 260,167 M 257,169.5 L 260,166.5 L 263,169.5" fill="none" stroke="#cfd4d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Vier Tasten als Raute — Farben in den BUCHSTABEN, wie am Geraet -->
  <g data-taste="307" data-name="Y (oben)" filter="url(#xBtnShadow)">
    <circle cx="388" cy="104" r="17" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1" />
    <text x="388" y="111" text-anchor="middle" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#f4c11f">Y</text>
  </g>
  <g data-taste="308" data-name="X (links)" filter="url(#xBtnShadow)">
    <circle cx="352" cy="140" r="17" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1" />
    <text x="352" y="147" text-anchor="middle" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#2e9bd6">X</text>
  </g>
  <g data-taste="305" data-name="B (rechts)" filter="url(#xBtnShadow)">
    <circle cx="424" cy="140" r="17" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1" />
    <text x="424" y="147" text-anchor="middle" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#d63b2f">B</text>
  </g>
  <g data-taste="304" data-name="A (unten)" filter="url(#xBtnShadow)">
    <circle cx="388" cy="176" r="17" fill="url(#xBtnGrad)" stroke="#383d43" stroke-width="1" />
    <text x="388" y="183" text-anchor="middle" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="bold" font-size="19" fill="#6db33f">A</text>
  </g>

  <!-- Steuerkreuz — Sammelflaeche, Achsen 16/17 (keine Tasten!) -->
  <g data-taste="ring" data-name="Steuerkreuz">
    <circle cx="196" cy="210" r="40" fill="#101214" stroke="#383d43" stroke-width="1.5" filter="url(#xBtnShadow)" />
    <path d="M 186,182 h 20 v 18 h 18 v 20 h -18 v 18 h -20 v -18 h -18 v -20 h 18 z"
          fill="url(#xBtnGrad)" stroke="#33373c" stroke-width="1" />
    <path d="M 196,190 l 4,5 h -8 z" fill="#8a9096" />
    <path d="M 196,230 l 4,-5 h -8 z" fill="#8a9096" />
    <path d="M 176,210 l 5,4 v -8 z" fill="#8a9096" />
    <path d="M 216,210 l -5,4 v -8 z" fill="#8a9096" />
  </g>

  <!-- Rechter Stick — bewusst unbelegt (Analograuschen, siehe Profil) -->
  <g data-taste="x-stick-rechts" data-name="Rechter Stick (unbelegt)">
    <circle cx="324" cy="210" r="38" fill="#101214" stroke="#383d43" stroke-width="1.5" filter="url(#xBtnShadow)" />
    <circle cx="324" cy="210" r="27" fill="url(#xStickGrad)" stroke="#2c3036" stroke-width="1" />
    <circle cx="324" cy="210" r="19" fill="none" stroke="#0b0c0d" stroke-width="2.5" />
  </g>
</svg>
