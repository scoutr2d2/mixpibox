# MuPiBox ALSA-Konfiguration — Karte per NAMEN, nicht per Nummer.
#
# WARUM: Die Karten-Reihenfolge ist zwischen Neustarts NICHT stabil. Auf dem Pi 5
# ist der MAX98357A mal card 0, mal card 2 (die beiden HDMI-Ausgaenge wandern).
# Ein fest verdrahtetes "plughw:0" zeigt dann auf HDMI ohne Bildschirm: JEDE
# Wiedergabe scheitert mit ENOTSUPP (Fehler 524), PulseAudio faellt auf auto_null
# zurueck, der softvol-Regler "Master" entsteht nie — und der MuPiBox-Player stirbt
# beim Start an `amixer sget Master` und wird von pm2 endlos neu gestartet.
# (Am Geraet belegt 2026-07-25: 58 Neustarts, kein Ton, Oberflaeche drehte ewig.)
pcm.mupibox {
    type softvol
    slave.pcm "plughw:CARD=MAX98357A,DEV=0"
    control.name "Master"
    control.card "MAX98357A"
}
pcm.!default {
    type plug
    slave.pcm "mupibox"
}
ctl.!default {
    type hw
    card "MAX98357A"
}
