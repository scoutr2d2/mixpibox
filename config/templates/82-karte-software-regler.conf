# Die Tonkarte regelt in SOFTWARE — weil ihr Hardware-Regler eine Attrappe ist.
#
# WARUM (05.09.2026, am Geraet gemessen):
# Der Betreiber: "angeblich ist es 7% aber es ist 100 laut". Der Blick in die
# Karten-Props zeigte die Schere:
#
#     channelVolumes = [ 6.4e-05 ]   <- was der Regler gestellt hat (4%)
#     softVolumes    = [ 0.0227  ]   <- was WIRKLICH angewandt wurde
#
# PipeWire hielt hw:0 fuer eine Karte mit Hardware-Lautstaerke und schob den
# Reglerwert dorthin — aber der MAX98357A-DAC HAT keinen Lautstaerkeregler.
# Der Wert verschwand ins Leere, hoerbar blieb ein nachhinkender Software-
# Rest. Jede Anzeige stimmte, nur der Ton nicht: die "wetterwendische Senke",
# die seit Wochen mal gehorchte und mal nicht.
#
# soft-mixer = true zwingt PipeWire, IMMER in Software zu regeln. Danach gilt
# nachpruefbar: softVolumes == channelVolumes (tools/karten-regler-wirkt-probe.sh).
#
# NUR DIESE KARTE: Bluetooth-Geraete regeln weiter selbst (absolute-volume),
# und eine kuenftige andere Karte soll erst gemessen, dann behandelt werden.
#
# AM DEVICE, NICHT AM NODE (am Geraet gelernt, 05.09.2026): ein erster Wurf
# matchte node.name — die Prop landete brav am Sink-Knoten und BEWIRKTE
# NICHTS, denn ausgewertet wird sie von der Kartenverwaltung (ACP), und die
# haengt am Audio/Device `alsa_card...`. Danach stand die Karte stur auf
# 1.0: channelVolumes == softVolumes, aber kein Stellbefehl kam mehr durch.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-soc_107c000000_sound" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
