# NUR A2DP — die Box braucht nie ein Bluetooth-Mikrofon (15.08.2026).
# Gehoert nach /etc/wireplumber/wireplumber.conf.d/.
#
# WARUM: Lautsprecher mit Mikrofon (die Xiaomi-Box) bieten auch das
# Freisprech-Profil (HFP/HSP) an. WirePlumber versuchte es im Halbminutentakt
# nachzuverbinden, der SDP-Abruf scheiterte („Unable to get Hands-Free Voice
# gateway SDP record: Host is down", bluetoothd-Journal), und JEDER Versuch
# stoerte den laufenden A2DP-Strom — der Betreiber hoerte abgehackten Ton,
# waehrend der PipeWire-Graph fehlerfrei lief (pw-top: ERR 0). Obendrein
# kippte die Senke zeitweise in den HFP-Modus (1 Kanal, 16 kHz — Telefon-
# qualitaet). Ohne die Freisprech-Rollen gibt es beides nicht mehr.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}
