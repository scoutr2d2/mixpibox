# Funknetze fuer die ZWEITE Karte (USB-Stick, wlan1) — NUR das Geruest.
#
# ZUGANGSDATEN SIND HANDEINGABE JE HAUS (derselbe Grundsatz wie beim
# add_wifi-Weg): dieses Rezept liefert die Mechanik, nie Geheimnisse.
# Ohne eingetragenes Netz verbindet der Stick schlicht nicht; wlan0
# traegt dann allein — die Box bleibt erreichbar.
#
# PRIORITAET: das 5-GHz-Netz HOEHER eintragen (priority 30) als das
# 2,4-GHz-Netz (priority 20). Der uebliche Stick (Realtek 8822BU) kann
# 5 GHz, dort ist das Spektrum leerer; am Geraet (06.09.2026, Box .62)
# war der Wechsel auf 5 GHz deutlich guenstiger fuer RSSI und Retries.
# Das 2,4-GHz-Netz bleibt als Rueckfall fuer Ecken, die 5 GHz nicht
# erreicht.
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=1
country=DE

