# KLANG (EQUALIZER) — fuenf Baender als PipeWire-Filterkette (15.08.2026).
# Gehoert nach /etc/pipewire/pipewire.conf.d/. Eingeschaltet wird er, indem
# die Senke "entzerrer" zur Standard-Senke wird; sein Ausgang wandert dann
# auf das gewaehlte Ziel (Ton-Seite der Verwaltung, /api/ton). Die
# Band-Regler stellt der Server zur Laufzeit (Props params, eq_*:Gain).
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Klang (Equalizer)"
      media.name = "Klang (Equalizer)"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_lowshelf  name = eq_tief   control = { "Freq" = 100.0   "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin label = bq_peaking   name = eq_tmitte control = { "Freq" = 250.0   "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin label = bq_peaking   name = eq_mitte  control = { "Freq" = 1000.0  "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin label = bq_peaking   name = eq_hmitte control = { "Freq" = 4000.0  "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin label = bq_highshelf name = eq_hoch   control = { "Freq" = 10000.0 "Q" = 1.0 "Gain" = 0.0 } }
        ]
        links = [
          { output = "eq_tief:Out"   input = "eq_tmitte:In" }
          { output = "eq_tmitte:Out" input = "eq_mitte:In" }
          { output = "eq_mitte:Out"  input = "eq_hmitte:In" }
          { output = "eq_hmitte:Out" input = "eq_hoch:In" }
        ]
      }
      capture.props = {
        node.name = "entzerrer"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "entzerrer.ausgang"
        node.passive = true
        audio.position = [ FL FR ]
      }
    }
  }
]
