# DIE LEERSENKE DES MITSCHNITTS (MixPi, 21.08.2026).
# Gehoert nach /etc/pipewire/pipewire.conf.d/.
#
# ══ WOZU EINE SENKE, DIE NIEMAND HOERT ══════════════════════════════════════
#
# Der Leerlauf-Arbeiter (E66) spielt Titel SELBST, um sie aufzunehmen — mit
# eigenem Zugang, im Leerlauf, waehrend niemand hoert. Ohne eigenes Tonziel
# ginge dieser zweite Strom auf denselben Lautsprecher wie die Familie. Das
# ist genau die Form, die in E63 als ECHO gemeldet wurde: zwei Stroeme auf
# einem Geraet, und man hoert beide.
#
# Deshalb bekommt Soloist mit `-d mixpi-mitschnitt` ein Ziel, das ins Leere
# fuehrt. Der Mitschneider haengt sich NICHT an diese Senke, sondern per
# `pw-link` direkt an die Ausgangsports des Aufnahme-Prozesses — die Senke
# muss den Ton also nur schlucken, nicht weiterreichen.
#
# ══ WARUM NICHT EINFACH KEINE SENKE ═════════════════════════════════════════
#
# Ohne `-d` folgt Soloist der Standard-Senke (am Geraet gemessen, E42/S1) —
# und die ist auf dieser Box der `entzerrer`, also der Weg zum Lautsprecher.
# „Kein Ziel angeben" heisst hier nicht „still", sondern „ueberall".
#
# ══ DIE ZAHL IM NAMEN ═══════════════════════════════════════════════════════
#
# 62, also NACH dem Entzerrer (61). Die Reihenfolge ist hier ohne Wirkung —
# die beiden wissen nichts voneinander —, aber sie haelt die Datei dort, wo
# jemand sie sucht, der 61 schon kennt.

context.objects = [
  { factory = adapter
    args = {
      # `support.null-audio-sink` ist PipeWires eigene Leersenke: sie nimmt
      # Ton an und wirft ihn weg. Kein ALSA-Geraet dahinter, keine Hardware,
      # kein Strom.
      factory.name     = support.null-audio-sink
      node.name        = "mixpi-mitschnitt"
      node.description = "MixPi Mitschnitt (still)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]

      # HIER STANDEN `node.dont-reconnect = true` UND ZWEI NULL-PRIORITAETEN,
      # damit die Senke nicht in der Geraeteliste der Ton-Seite auftaucht. Die
      # Absicht war richtig, die Wirkung fatal: SOLOIST KONNTE SIE DANN NICHT
      # MEHR BESPIELEN. Er nahm `-d mixpi-mitschnitt` an, meldete „playing" —
      # und erzeugte keinen einzigen Tonknoten.
      #
      # AM GERAET GEMESSEN (21.08.2026), derselbe Befehl zweimal:
      #     mit -d mixpi-mitschnitt   ->  0 spotify-Knoten
      #     ohne -d                   ->  2 spotify-Knoten
      #
      # Eine Senke, die niemand hoert, ist etwas anderes als eine, die niemand
      # BENUTZEN kann. Der Schutz gegen versehentliches Auswaehlen gehoert
      # deshalb in die Oberflaeche, nicht in die Senke selbst.
    }
  }
]
